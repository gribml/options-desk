name: Deploy Frontend

on:
  push:
    branches: [main]
    paths-ignore:
      - "worker/**"
      - "scripts/**"
      - "CLAUDE.md"

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    environment: cf-pages
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2

      - uses: jetli/trunk-action@v0.5.0
        with:
          version: latest

      - name: Create .env from secrets
        run: |
          printf 'SUPABASE_URL=%s\n'      "${{ secrets.SUPABASE_URL }}"      >> .env
          printf 'SUPABASE_ANON_KEY=%s\n' "${{ secrets.SUPABASE_ANON_KEY }}" >> .env
          printf 'WORKER_URL=%s\n'        "${{ secrets.WORKER_URL }}"        >> .env

      - name: Build
        run: trunk build --release

      # trunk emits the WASM SPA into dist/app/ (see Trunk.toml). Drop the static
      # landing page at the dist root so Cloudflare Pages serves it at /.
      - name: Assemble static landing page
        run: |
          cp landing/index.html dist/index.html
          cp landing/_redirects dist/_redirects

      - name: Deploy to Cloudflare Pages
        run: npx wrangler pages deploy dist --project-name=${{ secrets.CF_PAGES_PROJECT_NAME }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
