name: Deploy Worker

on:
  push:
    branches: [main]
    paths:
      - "worker/**"

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: cf-worker
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        working-directory: worker
        run: npm ci

      - name: Inject D1 config
        run: |
          sed -i "s/PLACEHOLDER_D1_DATABASE_NAME/${{ secrets.D1_DATABASE_NAME }}/" worker/wrangler.toml
          sed -i "s/PLACEHOLDER_D1_DATABASE_ID/${{ secrets.D1_DATABASE_ID }}/" worker/wrangler.toml

      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: worker
