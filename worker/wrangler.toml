name = "options-desk-worker"
main = "src/index.ts"
compatibility_date = "2024-01-01"

# Denial-of-wallet guard: cap per-request CPU time (default on Paid is 30000ms).
# These handlers are I/O-bound (D1 / Supabase fetch) and use only a few ms of
# actual CPU, so 50ms is ample headroom while bounding the cost a flood of
# expensive requests could ring up. Raise this if you ever see 1102
# "Worker exceeded CPU time limit" errors on legitimate traffic.
[limits]
cpu_ms = 50

# Local dev: copy .dev.vars.example to .dev.vars and fill in values.
# Production: set each secret with `wrangler secret put <NAME>`:
#   ALPACA_KEY           — Alpaca API key ID
#   ALPACA_SECRET        — Alpaca API secret key
#   SUPABASE_URL         — e.g. https://xxxx.supabase.co
#   SUPABASE_SERVICE_KEY — service-role key (bypasses RLS for writes)
#   SUPABASE_ANON_KEY    — anon key (used to verify user JWTs)

[vars]
ALLOWED_ORIGIN = "https://options-desk-7c0.pages.dev"

[[d1_databases]]
binding = "DB"
database_name = "PLACEHOLDER_D1_DATABASE_NAME"
database_id = "PLACEHOLDER_D1_DATABASE_ID"
